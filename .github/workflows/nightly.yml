# Nightly rebuild and deploy.
#
# The site is a static export, so every number baked into the HTML — commit
# counts, "last pushed", the upstream contribution dates — is only as fresh as
# the last build. The homepage replaces those with live data a moment after it
# loads, but the *first paint* still shows the snapshot, and after a few weeks
# without a deploy that first frame is visibly old.
#
# Rebuilding once a night keeps the snapshot close to the truth, so the page is
# already right before the live fetch lands.
#
# Requires one repository secret: CLOUDFLARE_API_TOKEN (see docs/DEVELOPMENT.md).
# CLOUDFLARE_ACCOUNT_ID is also a secret, purely so a public repository carries
# no account identifiers.

name: Nightly rebuild

on:
  schedule:
    # 07:00 UTC — overnight in Atlanta, where the author is. GitHub runs cron on
    # a best-effort basis and may start it late when the queue is busy.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only — verify the toolchain without deploying"
        type: boolean
        default: false

# Never let two deploys of the same Worker overlap.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rebuild:
    # Guard so a fork of this public repository never tries to deploy to the
    # original account.
    if: github.repository == 'vinayreddykalluri/vinayreddykalluri'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check the deploy credential is present
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it with:"
            echo "::error::  gh secret set CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - run: npm ci

      - name: Build
        env:
          # The automatic Actions token authenticates the GitHub API calls in
          # scripts/fetch-github.mjs, which lifts the anonymous 60/hr limit to
          # 1,000/hr per repository. It reads nothing but public data.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Deploy to Cloudflare
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # A deploy that reports success but serves a broken page is the failure
      # mode worth catching, so the run ends by reading the live site back and
      # writing what it found into the run summary.
      - name: Verify the live site
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            status=$(curl -sS -o /tmp/home.html -w '%{http_code}' https://vinayreddykalluri.com/ || echo 000)
            [ "$status" = "200" ] && break
            echo "homepage returned $status, retrying ($attempt/5)"
            sleep 5
          done

          if [ "$status" != "200" ]; then
            echo "::error::Homepage returned $status after the deploy"
            exit 1
          fi

          if ! grep -q "Vinay Reddy Kalluri" /tmp/home.html; then
            echo "::error::Homepage served 200 but does not contain the expected content"
            exit 1
          fi

          curl -sS "https://vinayreddykalluri.com/api/github?debug=1" -o /tmp/debug.json || true

          {
            echo "### Nightly rebuild"
            echo
            echo "Homepage: \`200\`, content verified."
            echo
            echo "GitHub API, as the edge sees it:"
            echo
            echo '```json'
            cat /tmp/debug.json 2>/dev/null || echo '{ "error": "diagnostic unavailable" }'
            echo '```'
            echo
            echo "\`degraded\` lists figures the live call could not resolve, which"
            echo "fall back to this build's snapshot. A non-empty list with"
            echo "\`\"auth\": \"anon\"\` means the shared-IP rate limit is being hit —"
            echo "set a GITHUB_TOKEN Worker secret to remove it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report the dry run
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Dry run"
            echo
            echo "Built successfully; nothing was deployed."
            echo
            echo "Snapshot this build would have shipped:"
            echo
            echo '```json'
            node -e '
              const d = require("./src/data/github.json");
              console.log(JSON.stringify({
                fetchedAt: d.fetchedAt,
                commits: d.commits,
                commitsLast90: d.commitsLast90,
                publicRepos: d.publicRepos,
                lastActiveAt: d.lastActiveAt,
                upstream: d.upstream,
              }, null, 2));
            '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
